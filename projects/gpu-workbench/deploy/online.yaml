apiVersion: apps/v1
kind: Deployment
metadata: {name: workbench-online, namespace: gpu-workbench}
spec:
  replicas: 1
  selector:
    matchLabels: {app: workbench-online}
  template:
    metadata:
      labels:
        app: workbench-online
        koordinator.sh/qosClass: LS
    spec:
      schedulerName: koord-scheduler
      priorityClassName: koord-prod
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: online
        image: python:3.12.11-slim-bookworm
        command: ['python3', '-u', '/app/online.py']
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: '1', memory: 128Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ['ALL']}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
        volumeMounts: [{name: code, mountPath: /app, readOnly: true}]
      volumes:
      - name: code
        configMap: {name: workbench-worker}
---
apiVersion: v1
kind: Service
metadata: {name: workbench-online, namespace: gpu-workbench}
spec:
  selector: {app: workbench-online}
  ports: [{port: 8080, targetPort: 8080}]
